[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "BallisticSniper"
description = "Anti-Material Rifle — a heavy kinetic bolt-action sniper for Mycopunk. High single-shot damage, low capacity, single-round reload."
websiteUrl = "https://github.com/Little-Sparroh/BallisticSniper"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/BallisticSniper.dll"
target = "BepInEx/plugins/BallisticSniper.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
